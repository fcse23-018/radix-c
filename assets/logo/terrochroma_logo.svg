<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with soil gradient -->
  <defs>
    <linearGradient id="soilGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5D4037;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3E2723;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E7D32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#689F38;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main circle background -->
  <circle cx="256" cy="256" r="240" fill="url(#soilGradient)" />

  <!-- Stylized leaf/chromatic motif -->
  <g transform="translate(256, 256)">
    <!-- Left leaf -->
    <path d="M-80,20 Q-120,-40 -60,-80 Q0,-40 -40,20 Q-60,60 -80,20"
          fill="url(#leafGradient)" opacity="0.9" />

    <!-- Right leaf -->
    <path d="M80,20 Q120,-40 60,-80 Q0,-40 40,20 Q60,60 80,20"
          fill="url(#leafGradient)" opacity="0.9" />

    <!-- Center spectrum lines (chromatic) -->
    <line x1="-30" y1="-60" x2="-30" y2="60" stroke="#689F38" stroke-width="4" opacity="0.8" />
    <line x1="-10" y1="-60" x2="-10" y2="60" stroke="#388E3C" stroke-width="4" opacity="0.8" />
    <line x1="10" y1="-60" x2="10" y2="60" stroke="#2E7D32" stroke-width="4" opacity="0.8" />
    <line x1="30" y1="-60" x2="30" y2="60" stroke="#689F38" stroke-width="4" opacity="0.8" />

    <!-- Bottom soil curve -->
    <path d="M-100,60 Q0,100 100,60 Q120,40 100,20 Q0,60 -100,20 Q-120,40 -100,60"
          fill="#EFEBE9" opacity="0.3" />
  </g>

  <!-- "TC" monogram (simplified) -->
  <text x="256" y="320" font-family="Arial, sans-serif" font-size="80" font-weight="bold"
        fill="#F5F5F0" text-anchor="middle">TC</text>
</svg>
