name: ci

on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r training/requirements.txt
      - run: python -m pytest training/tests -q
      # Pipeline smoke test: synthetic data can never produce a reportable model.
      - run: python training/train_soc.py --synthetic --out build

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      # Optional release signing. Add SOILCARBON_KEYSTORE_BASE64,
      # SOILCARBON_KEYSTORE_PASSWORD, SOILCARBON_KEY_ALIAS and SOILCARBON_KEY_PASSWORD as
      # repository secrets. With no secrets the release artifacts are built unsigned.
      - name: Decode release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.SOILCARBON_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          fi

      - name: Unit tests
        run: bash ./gradlew test

      - name: Assemble release APK and App Bundle
        env:
          SOILCARBON_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          SOILCARBON_KEYSTORE_PASSWORD: ${{ secrets.SOILCARBON_KEYSTORE_PASSWORD }}
          SOILCARBON_KEY_ALIAS: ${{ secrets.SOILCARBON_KEY_ALIAS }}
          SOILCARBON_KEY_PASSWORD: ${{ secrets.SOILCARBON_KEY_PASSWORD }}
        run: bash ./gradlew assembleRelease bundleRelease

      - name: Verify release signature when a keystore is configured
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
        run: |
          if [ -f "$KEYSTORE_PATH" ]; then
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
            APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
            AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -n 1)
            "$APKSIGNER" verify --print-certs "$APK"
            jarsigner -verify "$AAB"
            echo "Release APK and AAB verified as signed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice title=signing::No SOILCARBON_KEYSTORE_BASE64 secret; release artifacts are unsigned."
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soilcarbon-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

  # Device-only tests (encrypted lifecycle, FileProvider grants, NFR-1 latency, NFR-2 capacity).
  # GitHub-hosted Linux runners expose /dev/kvm, so these run on a real Android system image even
  # when the development machine has no hypervisor.
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify KVM access
        run: |
          ls -l /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/run-instrumented-tests.sh

      - name: Emulator failure diagnostics
        if: failure()
        timeout-minutes: 5
        env:
          ADB: ${{ env.ANDROID_HOME }}/platform-tools/adb
        run: |
          {
            echo "### Post-failure device state"
            echo
            echo "- boot_completed: \`$(timeout 20 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')\`"
            echo "- adb devices:"
            echo '```'
            timeout 20 adb devices -l || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          timeout 30 adb logcat -d -t 300 2>/dev/null || true

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
