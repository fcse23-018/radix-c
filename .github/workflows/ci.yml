name: ci

on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r training/requirements.txt
      - run: python -m pytest training/tests -q
      # Pipeline smoke test: synthetic data can never produce a reportable model.
      - run: python training/train_soc.py --synthetic --out build

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew :domain:test
